services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tafseer-db
    environment:
      POSTGRES_USER: tafseer
      POSTGRES_PASSWORD: tafseer
      POSTGRES_DB: tafseer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tafseer"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    image: tafseer-app
    container_name: tafseer-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tafseer:tafseer@db:5432/tafseer
      TAFSEER_LLM_KEY: ${TAFSEER_LLM_KEY:?set in a .env file next to docker-compose.yml}
      TAFSEER_LLM_BASE: ${TAFSEER_LLM_BASE:-https://openrouter.ai/api/v1}
      TAFSEER_EMBED_MODEL: ${TAFSEER_EMBED_MODEL:-openai/text-embedding-3-small}
      TAFSEER_CHAT_MODEL: ${TAFSEER_CHAT_MODEL:-glm-5.3-flash}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: