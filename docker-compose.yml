services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tafseer-db
    environment:
      POSTGRES_USER: tafseer
      POSTGRES_PASSWORD: tafseer
      POSTGRES_DB: tafseer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tafseer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: