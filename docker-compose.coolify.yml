# Production stack deployed by Coolify on the VPS.
# docker-compose.yml stays the local dev stack (it publishes the db port).
# Coolify sets the public domain on the app service and fills the ${...}
# values from the environment variables of the Coolify resource.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tafseer
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: tafseer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tafseer"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://tafseer:${SERVICE_PASSWORD_POSTGRES}@db:5432/tafseer
      AGENT_SERVER_URL: http://agent-server:3101
      TAFSEER_LLM_KEY: ${TAFSEER_LLM_KEY:?}
      TAFSEER_LLM_BASE: ${TAFSEER_LLM_BASE:-https://openrouter.ai/api/v1}
      TAFSEER_EMBED_MODEL: ${TAFSEER_EMBED_MODEL:-openai/text-embedding-3-small}
      TAFSEER_CHAT_MODEL: ${TAFSEER_CHAT_MODEL:-glm-5.3-flash}
      TAFSEER_TTS_CACHE_DIR: /tts-cache
      EDITOR_TOKEN: ${EDITOR_TOKEN}
      EDITOR_NAME: ${EDITOR_NAME}
    volumes:
      - ttscache:/tts-cache
    depends_on:
      db:
        condition: service_healthy

  agent-server:
    build:
      context: .
      dockerfile: agent-server/Dockerfile
    environment:
      DATABASE_URL: postgresql://tafseer:${SERVICE_PASSWORD_POSTGRES}@db:5432/tafseer
      TAFSEER_LLM_KEY: ${TAFSEER_LLM_KEY:?}
      TAFSEER_LLM_BASE: ${TAFSEER_LLM_BASE:-https://openrouter.ai/api/v1}
      TAFSEER_CHAT_MODEL: ${TAFSEER_CHAT_MODEL:-glm-5.3-flash}
      AGENT_SQLITE: /data/agent.sqlite
    volumes:
      - agentdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  agentdata:
  ttscache:
